name: Run Python Script and Commit Changes

permissions:
  contents: write
  
on:
  schedule:
    # Runs every 1 hours
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'  # Specify the Python version you want

    - name: Install dependencies
      run: |
        pip install -r requirements.txt  # Adjust if you have specific requirements

    - name: Run script
      run: python script.py  # Run your script
      env:
        MAINTAINERS_POLLING_TOKEN: ${{secrets.MAINTAINERS_POLLING_TOKEN}}

    - name: Build monthly contributor data
      run: python monthly.py
      env:
        MAINTAINERS_POLLING_TOKEN: ${{secrets.MAINTAINERS_POLLING_TOKEN}}


    - name: Commit changes
      id: commit
      run: |
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"

        # Get the current date in a human-readable format
        DATE=$(date +"%Y-%m-%d %H:%M:%S")

        # Stage all changes
        git add .

        # Commit and push only if contributors.json actually changed
        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "refreshing contributor list ${DATE}"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
    # Discord update has to run here rather than in a separate on-push workflow.
    # Manual (workflow_dispatch) runs always update Discord, so it can be tested on demand.
    - name: Update Discord top contributors message
      if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
      run: python update_discord_webhook.py
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
